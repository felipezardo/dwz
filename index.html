<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon World 2 — Fichas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="masthead">
  <div class="logo" aria-label="Dungeon World 2"><svg viewBox="0 0 24 32" aria-hidden="true"><path d="M12 1c1 6 8 9 8 18a8 8 0 0 1-16 0c0-4 2-6 3-8 1 2 2 3 3 3 0-5-1-8 2-13Z"/></svg><span>Dungeon<br>World</span><b>2</b></div>
  <nav aria-label="Personagens">
    <select id="charSelect" aria-label="Personagem salvo"></select>
    <button data-act="new">Novo</button>
    <button data-act="import" class="ghost">Importar</button>
    <button data-act="export" id="exportChar" class="ghost">Exportar</button>
    <button data-act="del" id="delChar" class="ghost">Excluir</button>
    <input type="file" id="file" accept="application/json" hidden>
  </nav>
</header>
<main id="app"></main>
<div id="roller" class="roller" hidden aria-live="assertive"></div>
<dialog id="dlg"></dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
